<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195">
  <style>
    @keyframes pulse {
      0% { stroke-width: 1.5px; stroke: #00FF00; filter: drop-shadow(0 0 2px rgba(0, 255, 0, 0.4)); }
      50% { stroke-width: 2.5px; stroke: #00FF00; filter: drop-shadow(0 0 10px rgba(0, 255, 0, 0.8)); }
      100% { stroke-width: 1.5px; stroke: #00FF00; filter: drop-shadow(0 0 2px rgba(0, 255, 0, 0.4)); }
    }
    @keyframes glow {
      0% { text-shadow: 0 0 2px rgba(0, 255, 0, 0.5); }
      50% { text-shadow: 0 0 8px rgba(0, 255, 0, 0.9); }
      100% { text-shadow: 0 0 2px rgba(0, 255, 0, 0.5); }
    }
    @keyframes rankGlow {
      0% { filter: drop-shadow(0 0 4px rgba(0, 255, 0, 0.6)); }
      50% { filter: drop-shadow(0 0 14px rgba(0, 255, 0, 1)); }
      100% { filter: drop-shadow(0 0 4px rgba(0, 255, 0, 0.6)); }
    }
    .card {
      fill: #0A0F0D;
      stroke: #00FF00;
      animation: pulse 4s infinite;
      rx: 8px;
    }
    .title {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-weight: bold;
      font-size: 18px;
      fill: #00FF00;
      animation: glow 3s infinite;
    }
    .label {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 14px;
      fill: #8B949E;
    }
    .value {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 14px;
      fill: #00FF00;
      font-weight: bold;
    }
    .rank-circle {
      fill: none;
      stroke: #00FF00;
      stroke-width: 4;
      stroke-dasharray: 250;
      stroke-dashoffset: 40;
      transform-origin: center;
      animation: rotate 8s linear infinite;
    }
    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }
    .rank-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 32px;
      font-weight: 900;
      fill: #00FF00;
      text-anchor: middle;
      dominant-baseline: middle;
      animation: rankGlow 2s infinite;
    }
  </style>
  
  <rect x="2" y="2" width="491" height="191" class="card" />
  
  <text x="25" y="35" class="title">SYSTEM CONFIG &amp; METRICS</text>
  
  <!-- Stars -->
  <g transform="translate(25, 60)">
    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#00FF00" transform="scale(0.8)"/>
    <text x="25" y="14" class="label">Total Stars:</text>
    <text x="140" y="14" class="value">48</text>
  </g>
  
  <!-- Commits -->
  <g transform="translate(25, 95)">
    <circle cx="9" cy="9" r="4" fill="none" stroke="#00FF00" stroke-width="2"/>
    <line x1="9" y1="1" x2="9" y2="5" stroke="#00FF00" stroke-width="2"/>
    <line x1="9" y1="13" x2="9" y2="17" stroke="#00FF00" stroke-width="2"/>
    <text x="25" y="14" class="label">Total Commits:</text>
    <text x="140" y="14" class="value">312</text>
  </g>
  
  <!-- Pull Requests -->
  <g transform="translate(25, 130)">
    <circle cx="5" cy="5" r="3" fill="none" stroke="#00FF00" stroke-width="2"/>
    <circle cx="15" cy="13" r="3" fill="none" stroke="#00FF00" stroke-width="2"/>
    <path d="M5 8v4a2 2 0 002 2h5" fill="none" stroke="#00FF00" stroke-width="2"/>
    <text x="25" y="14" class="label">Total PRs:</text>
    <text x="140" y="14" class="value">24</text>
  </g>

  <!-- Rank Section -->
  <g transform="translate(380, 100)">
    <circle cx="0" cy="0" r="40" class="rank-circle" />
    <text x="0" y="2" class="rank-text">S+</text>
  </g>
</svg>
